<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Admin Login — Tehillah Movement</title>
  <link rel="stylesheet" href="styles.css"/>
  <script src="../config.js"></script>
  <style>
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
    .login-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(201,168,76,.08) 0%,transparent 65%),var(--navy)}
    .login-card{width:100%;max-width:420px;background:var(--navy-mid);border:1px solid rgba(201,168,76,.2);border-radius:10px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.5)}
    .login-header{padding:2.5rem 2.5rem 2rem;text-align:center;background:linear-gradient(180deg,rgba(201,168,76,.06),transparent);border-bottom:1px solid rgba(201,168,76,.1)}
    .login-logo{width:52px;height:52px;margin:0 auto 1.2rem;background:linear-gradient(135deg,var(--gold),var(--gold-dim));clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
    .login-title{font-family:'Cinzel',serif;font-size:1rem;color:var(--white);letter-spacing:.1em;margin-bottom:.3rem}
    .login-sub{font-size:.78rem;color:var(--white-dim)}
    .login-body{padding:2rem 2.5rem 2.5rem}
    .flabel{display:block;font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.15em;color:var(--gold);margin-bottom:.45rem}
    .finput{width:100%;padding:.85rem 1rem .85rem 2.4rem;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.2);color:var(--white);font-family:'Inter',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s;margin-bottom:1.2rem}
    .finput:focus{border-color:var(--gold)}
    .input-wrap{position:relative;margin-bottom:0}
    .input-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--white-dim);font-size:.9rem;pointer-events:none}
    .pw-toggle{position:absolute;right:.85rem;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--white-dim);font-size:.85rem;background:none;border:none}
    .login-opts{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
    .remember{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--white-dim);cursor:pointer}
    .remember input{accent-color:var(--gold)}
    .forgot{font-size:.75rem;color:var(--gold);text-decoration:none}
    .login-btn{width:100%;padding:.9rem;background:linear-gradient(135deg,var(--gold),var(--gold-dim));border:none;color:var(--navy);font-family:'Cinzel',serif;font-size:.75rem;letter-spacing:.15em;font-weight:600;cursor:pointer;border-radius:4px;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:.5rem}
    .login-btn:hover{opacity:.88}
    .login-error{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.3);color:#F08080;padding:.75rem 1rem;border-radius:4px;font-size:.82rem;margin-bottom:1.2rem;display:none;align-items:center;gap:.5rem}
    .login-error.show{display:flex}
    .login-footer{padding:1rem 2.5rem 1.5rem;text-align:center;border-top:1px solid rgba(201,168,76,.1)}
    .login-footer a{font-size:.72rem;color:var(--white-dim);text-decoration:none}
    .login-footer a:hover{color:var(--gold)}
    .demo-box{margin-top:1rem;padding:.8rem;background:rgba(201,168,76,.05);border:1px solid rgba(201,168,76,.12);border-radius:4px;text-align:left}
    .demo-box p{font-size:.7rem;color:var(--white-dim);margin-bottom:.2rem}
    .demo-box span{font-family:'Cinzel',serif;font-size:.7rem;color:var(--gold)}
    .spinner{display:none;width:15px;height:15px;border:2px solid rgba(6,9,26,.3);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div class="login-bg"></div>

<div class="login-card">
  <div class="login-header">
    <div class="login-logo"></div>
    <div class="login-title">TEHILLAH ADMIN</div>
    <p class="login-sub">Sign in to the management dashboard</p>
  </div>

  <div class="login-body">
    <div class="login-error" id="loginError"><span>⚠</span><span id="errMsg">Invalid email or password.</span></div>

    <label class="flabel">Email Address</label>
    <div class="input-wrap" style="margin-bottom:1.2rem;">
      <span class="input-icon">✉</span>
      <input type="email" class="finput" id="loginEmail" placeholder="admin@tehillahmovement.org" autocomplete="email" style="padding-left:2.4rem;margin-bottom:0;"/>
    </div>

    <label class="flabel">Password</label>
    <div class="input-wrap" style="margin-bottom:1.2rem;">
      <span class="input-icon">🔒</span>
      <input type="password" class="finput" id="loginPw" placeholder="Your password" autocomplete="current-password" style="padding-left:2.4rem;padding-right:2.5rem;margin-bottom:0;"/>
      <button class="pw-toggle" onclick="togglePw()" type="button">👁</button>
    </div>

    <div class="login-opts">
      <label class="remember"><input type="checkbox" id="rememberMe"/> Remember me</label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="login-btn" id="loginBtn" onclick="doLogin()">
      <span id="btnText">Sign In to Dashboard</span>
      <span class="spinner" id="btnSpinner"></span>
    </button>
  </div>

  <div class="login-footer">
    <a href="../index.html">← Back to public website</a>
    <div class="demo-box">
      <p>Demo credentials:</p>
      <p>Email: <span>admin@tehillah.org</span></p>
      <p>Password: <span>Admin@2025</span></p>
      <p style="margin-top:.5rem;font-size:.65rem;color:rgba(201,168,76,.5);">Replace with your real Firebase user after setup.</p>
    </div>
  </div>
</div>

<!-- Firebase Auth -->
<script type="module">
  import { initializeApp }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword,
           onAuthStateChanged }                     from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app  = initializeApp(TEHILLAH_CONFIG.firebase);
  const auth = getAuth(app);

  // Already logged in?
  onAuthStateChanged(auth, user => {
    if (user) window.location.href = 'index.html';
  });

  window.doLogin = async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pw    = document.getElementById('loginPw').value;
    const errEl = document.getElementById('loginError');
    const btn   = document.getElementById('loginBtn');
    errEl.classList.remove('show');

    if (!email || !pw) { document.getElementById('errMsg').textContent='Please enter your email and password.'; errEl.classList.add('show'); return; }

    btn.style.opacity = '.7'; btn.style.pointerEvents = 'none';
    document.getElementById('btnText').style.display = 'none';
    document.getElementById('btnSpinner').style.display = 'inline-block';

    try {
      await signInWithEmailAndPassword(auth, email, pw);
      sessionStorage.setItem('tehillah_admin','true');
      window.location.href = 'index.html';
    } catch(err) {
      const msgs = {
        'auth/user-not-found':  'No admin account found with that email.',
        'auth/wrong-password':  'Incorrect password. Please try again.',
        'auth/invalid-email':   'Please enter a valid email address.',
        'auth/too-many-requests':'Too many attempts. Please wait a moment.'
      };
      document.getElementById('errMsg').textContent = msgs[err.code] || 'Sign in failed. Please try again.';
      errEl.classList.add('show');
    }

    btn.style.opacity = ''; btn.style.pointerEvents = '';
    document.getElementById('btnText').style.display = 'inline';
    document.getElementById('btnSpinner').style.display = 'none';
  };

  window.togglePw = () => {
    const pw = document.getElementById('loginPw');
    const btn = document.querySelector('.pw-toggle');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    btn.textContent = pw.type === 'password' ? '👁' : '🙈';
  };

  document.addEventListener('keydown', e => { if(e.key==='Enter') window.doLogin(); });
</script>
</body>
</html>
